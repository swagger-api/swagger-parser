name: Build Test Deploy v3

on:
  push:
    branches: [ "v3" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21 ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v6.2.0
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        overwrite-settings: false
    - name: Add Central-Portal snapshot repo to settings.xml
      uses: s4u/maven-settings-action@v4.1.0
      with:
        repositories: '[{"id":"central-portal-snapshots","name":"Sonatype Central Portal snapshots","url":"https://central.sonatype.com/repository/maven-snapshots/","releases":{"enabled":false},"snapshots":{"enabled":true}}]'
        servers: '[{"id":"central","username":"${{ secrets.MAVEN_CENTRAL_USERNAME }}","password":"${{ secrets.MAVEN_CENTRAL_PASSWORD }}"}]'
    - name: Bind central credentials to Central Portal
      # Maven 3.10+ only sends server credentials to declared origins; without this,
      # server id "central" is bound to repo.maven.apache.org and deploys get HTTP 401.
      run: |
        sed -i "s#<id>central</id>#<id>central</id><repositoryOrigins><repositoryOrigin>https://central.sonatype.com</repositoryOrigin></repositoryOrigins>#" "$HOME/.m2/settings.xml"
        grep -q "<repositoryOrigin>https://central.sonatype.com</repositoryOrigin>" "$HOME/.m2/settings.xml"
    - name: Cache local Maven repository
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build with Maven, Deploy snapshot to maven central
      run: |
        export MY_POM_VERSION=`mvn -q -Dexec.executable="echo" -Dexec.args='${projects.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:1.3.1:exec`
        echo "POM VERSION" ${MY_POM_VERSION}
        if [[ $MY_POM_VERSION =~ ^.*SNAPSHOT$ ]];
        then
          mvn --no-transfer-progress -B install --file pom.xml
          export MY_JAVA_VERSION=`java -version 2>&1 | head -1 | cut -d'"' -f2 | sed '/^1\./s///' | cut -d'.' -f1`
          echo "JAVA VERSION" ${MY_JAVA_VERSION}
          if [[ ${MY_JAVA_VERSION} == "17" ]];
          then
            export MY_POM_VERSION=`mvn -q -Dexec.executable="echo" -Dexec.args='${projects.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:1.3.1:exec`
            echo "POM VERSION" ${MY_POM_VERSION}
            mvn --no-transfer-progress -B clean deploy
          else
            echo "not deploying on java version: " ${MY_JAVA_VERSION}
          fi
        else
          echo "not building and maven publishing project as it is a release version: " ${MY_JAVA_VERSION}
        fi
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
